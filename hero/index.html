<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instamove Hero</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://use.typekit.net/jbf6whm.css">
    <style>
        body {
            margin: 0;
        }
        #hero {
            font-family: 'massilia', sans-serif;
            position: relative;
            width: 100%;
            height: 670px;
        }

        #hero .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #hero .background-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 60% 50%;
        }

        #hero h1 {
            width: 80%;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 20px;
            left: 54px;
            color: #FF0059;
            font-size: 160px;
            line-height: 135px;
        }

        #hero h1 svg {
            width: 150px;
            height: auto;
            color: #1E1D1C;
            display: inline-block;
            margin-top: -50px;
        }

        #hero h1 .newline {
            display: flex;
            gap: 15px;
        }

        .booking-bar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 70px;
            background: #FF0059;
            padding: 0px 15px;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            display: flex;
            align-items: center;
            max-width: 90%;
            width: 1280px;
            gap: 10px;
        }

        input {
            border: 0;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            padding: 10px;
            width: 40%;
        }

        button {
            border: 0;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            padding: 10px 20px;
            background: #000;
            color: #fff;
            width: 20%;
        }

        @media (max-width: 1280px) {
            #hero {
                height: 550px;
            }

            #hero h1 {
                font-size: 130px;
                line-height: 110px;
            }

            #hero .background-image img {
                object-position: 60% 50%;
            }

            #hero h1 svg {
                width: 120px;
                margin-top: -40px;
            }
        }


        @media (max-width: 1024px) {
            #hero {
                height: 500px;
            }

            #hero h1 {
                font-size: 120px;
                line-height: 100px;
            }

            #hero .background-image img {
                object-position: 60% 50%;
            }

            #hero h1 svg {
                width: 100px;
                margin-top: -30px;
            }
        }

        @media (max-width: 950px) {
            #hero {
                height: 450px;
            }

            #hero h1 {
                font-size: 100px;
                line-height: 80px;
            }

            #hero .background-image img {
                object-position: 60% 50%;
            }

            #hero h1 svg {
                width: 80px;
                margin-top: -20px;
            }
        }

        @media (max-width: 768px) {
            #hero {
                height: 400px;
            }

            #hero .background-image img {
                object-position: 85% 50%;
            }

            #hero h1 {
                font-size: 46px;
                width: 100%;
                left: 0;
                right: 0;
                bottom: 100px;
                top: auto;
                margin: 0 20px;
                text-align: center;
            }

            #hero h1 .newline {
                display: inline-flex;
                margin-top: 0;
            }

            #hero h1 svg {
                width: 50px;
                margin-top: -10px;
                color: #fff;
            }

            .booking-bar {
                bottom: -80px;
                flex-direction: column;
                padding: 20px 30px;
                height: fit-content;
                border-radius: 18px;
                width: calc(100% - 80px);
            }

            input, button {
                width: 100%;
            }
        }

    </style>
</head>
